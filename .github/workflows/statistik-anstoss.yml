# Verschickt am Monatsanfang den RENOVA Monatsbericht (Statistik des Vormonats) per E-Mail.
# Das Skript auf dem Server sendet pro Monat nur ein einziges Mal, weitere Aufrufe bewirken nichts.
name: Statistik Monatsbericht anstoßen
on:
  schedule:
    - cron: '20 5-9 1 * *'
    - cron: '20 6 2 * *'
  workflow_dispatch:
jobs:
  anstoss:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -A "RenovaStatistikCron" "https://www.renovatirol.at/monatsbericht.php"
